[package]
name = "token-ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "One ledger for every model call on this machine, in tokens, dollars and plan credits."

[dependencies]
anyhow = "1"
ely-gpui-component = { git = "https://github.com/ZacharyZhang-NY/Ely-GPUI-Components", rev = "b4716bb09bae4ee9c26afc7197d0f8f6c08f92c2" }
glob = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", default-features = false, features = ["stacker"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff4b409169bac058bca40dfbfeb7621d19b", features = ["font-kit"] }
jiff = "0.2"
log = "0.4"
rusqlite = { version = "0.32", features = ["backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zstd = "0.13"

[workspace]

# A charting app in debug-slow dependencies is unusable; optimize deps only.
[profile.dev.package."*"]
opt-level = 2
